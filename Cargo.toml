[package]
name = "laya-siro"
version = "0.1.0"
edition = "2021"

[dependencies]
ort = { version = "2.0.0-rc.13", features = ["ndarray", "load-dynamic"] }
ndarray = "0.17"
tokenizers = { version = "0.20", default-features = false, features = ["onig"] }
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
